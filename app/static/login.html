<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmelden – Haushaltsbuch</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
:root {
  --bg:      #FAFAFA;
  --surface: #FFFFFF;
  --sur2:    #F8FAFC;
  --border:  #E2E8F0;
  --bord2:   #CBD5E1;
  --text:    #0F172A;
  --text2:   #64748B;
  --text3:   #94A3B8;
  --blue:    #0052FF;
  --grad:    linear-gradient(135deg, #0052FF, #4D7CFF);
  --red:     #EF4444;
  --r:       12px;
  --r2:      16px;
  --sh-lg:     0 10px 24px rgba(0,0,0,.09);
  --sh-acc:    0 4px 14px rgba(0,82,255,.20);
  --sh-acc-lg: 0 8px 24px rgba(0,82,255,.30);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; line-height: 1.5;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px; -webkit-font-smoothing: antialiased;
}
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r2); box-shadow: var(--sh-lg);
  padding: 40px; width: 100%; max-width: 400px;
  animation: fadeInUp .4s cubic-bezier(.16,1,.3,1) both;
}
@keyframes fadeInUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform:none; } }
.logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.logo-icon {
  width: 40px; height: 40px; border-radius: 11px; background: var(--grad);
  display: flex; align-items: center; justify-content: center; box-shadow: var(--sh-acc);
}
.logo-text { font-size: 19px; font-weight: 800; letter-spacing: -.4px; }
h1 { font-size: 22px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 6px; }
.sub { color: var(--text2); font-size: 13px; margin-bottom: 26px; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 7px; }
input[type=password] {
  width: 100%; background: var(--sur2); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); padding: 11px 14px; font-size: 14px;
  font-family: inherit; outline: none; transition: border-color .18s, box-shadow .18s;
}
input[type=password]:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,82,255,.1); }
.field { margin-bottom: 16px; }
.check { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; color: var(--text2); font-size: 13px; cursor: pointer; user-select: none; }
.check input { accent-color: var(--blue); width: 15px; height: 15px; cursor: pointer; }
button {
  width: 100%; background: var(--grad); color: #fff; border: none;
  border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600;
  font-family: inherit; cursor: pointer; box-shadow: var(--sh-acc);
  transition: transform .18s, box-shadow .18s;
}
button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--sh-acc-lg); }
button:disabled { opacity: .6; cursor: default; }
.msg {
  display: none; margin-top: 16px; padding: 11px 14px; border-radius: 10px;
  font-size: 13px; background: rgba(239,68,68,.08); color: var(--red);
  border: 1px solid rgba(239,68,68,.2);
}
.msg.show { display: block; }
.hint { margin-top: 18px; font-size: 12px; color: var(--text3); line-height: 1.6; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    </div>
    <div class="logo-text">Haushaltsbuch</div>
  </div>

  <h1 id="title">Anmelden</h1>
  <p class="sub" id="subtitle">Bitte gib dein Passwort ein.</p>

  <form id="form" autocomplete="on">
    <div class="field">
      <label for="pw" id="pw-label">Passwort</label>
      <input type="password" id="pw" autocomplete="current-password" required autofocus>
    </div>

    <div class="field" id="pw2-field" style="display:none">
      <label for="pw2">Passwort wiederholen</label>
      <input type="password" id="pw2" autocomplete="new-password">
    </div>

    <label class="check" id="remember-wrap">
      <input type="checkbox" id="remember" checked> Angemeldet bleiben
    </label>

    <button type="submit" id="submit">Anmelden</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="hint" id="hint" style="display:none">
    Das Passwort gilt für alle Geräte im Haushalt. Es wird nur als Hash gespeichert –
    wenn du es vergisst, lässt es sich nur direkt in der Datenbank zurücksetzen.
  </div>
</div>

<script>
// Dark-Mode aus der Haupt-App übernehmen
if (localStorage.getItem('theme') === 'dark') {
  const r = document.documentElement.style;
  r.setProperty('--bg','#07090f'); r.setProperty('--surface','#0f1420');
  r.setProperty('--sur2','#141c2e'); r.setProperty('--border','#1e2a3d');
  r.setProperty('--bord2','#253047'); r.setProperty('--text','#e8eeff');
  r.setProperty('--text2','#8899b4'); r.setProperty('--text3','#4a5870');
}

let setupMode = false;

function showMsg(text) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.classList.add('show');
}
function clearMsg() { document.getElementById('msg').classList.remove('show'); }

async function boot() {
  const status = await fetch('/api/auth/status').then(r => r.json());
  if (status.authenticated) { location.href = '/'; return; }
  setupMode = !status.configured;
  if (setupMode) {
    document.getElementById('title').textContent = 'Passwort festlegen';
    document.getElementById('subtitle').textContent =
      'Beim ersten Start legst du ein Passwort fest, das den Zugriff schützt.';
    document.getElementById('pw-label').textContent = 'Neues Passwort (mind. 8 Zeichen)';
    document.getElementById('pw').setAttribute('autocomplete', 'new-password');
    document.getElementById('pw2-field').style.display = 'block';
    document.getElementById('remember-wrap').style.display = 'none';
    document.getElementById('submit').textContent = 'Passwort speichern';
    document.getElementById('hint').style.display = 'block';
  }
}

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  clearMsg();
  const pw = document.getElementById('pw').value;
  const btn = document.getElementById('submit');

  if (setupMode && pw !== document.getElementById('pw2').value) {
    showMsg('Die beiden Passwörter stimmen nicht überein.');
    return;
  }
  if (setupMode && pw.length < 8) {
    showMsg('Das Passwort muss mindestens 8 Zeichen haben.');
    return;
  }

  btn.disabled = true;
  btn.textContent = setupMode ? 'Wird gespeichert …' : 'Wird geprüft …';
  try {
    const body = setupMode
      ? { password: pw }
      : { password: pw, remember: document.getElementById('remember').checked };
    const r = await fetch(setupMode ? '/api/auth/setup' : '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (r.ok) { location.href = '/'; return; }
    const data = await r.json().catch(() => ({}));
    showMsg(data.detail || 'Anmeldung fehlgeschlagen.');
  } catch (err) {
    showMsg('Server nicht erreichbar.');
  }
  btn.disabled = false;
  btn.textContent = setupMode ? 'Passwort speichern' : 'Anmelden';
  document.getElementById('pw').value = '';
  document.getElementById('pw').focus();
});

boot();
</script>
</body>
</html>
